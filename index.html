<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Generador de Reels — Hipopótamo Pinturas</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<header>
  <div class="logo-icon">🦛</div>
  <div class="logo-text">
    <h1>Hipopótamo Reels</h1>
    <span>Generador de guiones para Instagram</span>
  </div>
</header>

<main class="container">

  <!-- Panel de filtros -->
  <div class="filters-panel">
    <h2 id="filtersTitle">Configura tus Reels</h2>

    <label class="mode-toggle" for="radioModeCheckbox">
      <input type="checkbox" id="radioModeCheckbox">
      <span>🎙️ Generar cuñas de radio (15 seg.) en vez de reels</span>
    </label>

    <div class="filters-grid">
      <div class="filter-group">
        <label for="tema">Temática</label>
        <select id="tema">
          <option value="">— Sin temática predefinida (usa solo el tema personalizado) —</option>
          <optgroup label="Productos y reformas">
            <option value="renovación de baño sin obra">Baño sin obra</option>
            <option value="suelos: tarima o vinilo para el hogar">Suelos (tarima / vinilo)</option>
            <option value="puertas interiores y su impacto visual">Puertas interiores</option>
            <option value="revestimientos de pared decorativos para el salón u otras estancias">Revestimientos de pared (salón)</option>
            <option value="revestimiento de paredes de baño: azulejo o panel decorativo sin obra">Revestimiento pared de baño</option>
            <option value="revestimiento de paredes de cocina: azulejo o panel decorativo sin obra">Revestimiento pared de cocina</option>
            <option value="palillería decorativa para transformar paredes sin obra">Palillería decorativa</option>
            <option value="ventanas eficientes y ahorro energético">Ventanas eficientes</option>
            <option value="pintura de interiores: renovar el color y acabado del hogar">Pintura de interiores</option>
          </optgroup>
          <optgroup label="Ángulos de contenido">
            <option value="sorpréndeme (elige el tema más efectivo para el canal)">Sorpréndeme</option>
            <option value="inspiración y tendencias en decoración">Inspiración / tendencias</option>
            <option value="tienda física y exposición de Hipopótamo">Tienda y exposición</option>
          </optgroup>
          <optgroup label="Campañas y promociones">
            <option value="promoción sin IVA en la reforma: destaca el ahorro y la urgencia de la oferta">Sin IVA</option>
            <option value="campaña de Black Friday: ofertas especiales por tiempo limitado en reformas del hogar">Black Friday</option>
          </optgroup>
        </select>
      </div>

      <div class="filter-group">
        <label for="urgencia">Urgencia / temporada</label>
        <select id="urgencia">
          <option value="">Sin urgencia específica</option>
          <option value="con la urgencia de tenerlo listo antes de Navidad">Antes de Navidad</option>
          <option value="aprovechando el cambio de estación para renovar el hogar">Cambio de estación</option>
          <option value="transmitiendo urgencia: últimas plazas de instalación disponibles este mes">Últimas plazas del mes</option>
          <option value="cerrando el año: última oportunidad para reformar antes de que acabe">Fin de año</option>
        </select>
      </div>

      <div class="filter-group" id="formatoGroup">
        <label for="formato">Formato</label>
        <select id="formato">
          <option value="">Cualquiera</option>
          <option value="formato antes y después con impacto visual">Antes y después</option>
          <option value="formato error común que comete la gente">Error común</option>
          <option value="formato comparativa directa entre dos opciones">Comparativa directa</option>
          <option value="formato caso real de cliente satisfecho">Caso real de cliente</option>
          <option value="formato transformación rápida paso a paso">Transformación rápida</option>
          <option value="formato mito vs realidad desmontando creencias">Mito vs realidad</option>
        </select>
      </div>

      <div class="filter-group">
        <label for="objecion">Objeción a resolver</label>
        <select id="objecion">
          <option value="">Sin objeción específica</option>
          <option value="resolviendo la objeción: ¿por qué no comprar barato en grandes superficies?">¿Por qué no comprar barato?</option>
          <option value="resolviendo la objeción: ¿qué garantía tengo si algo sale mal?">¿Qué garantía tengo?</option>
          <option value="resolviendo la objeción: ¿es de verdad sin obra ni escombros?">¿Sin obra de verdad?</option>
          <option value="resolviendo la objeción: ¿cuánto dura y resiste en el día a día?">¿Cuánto dura / resiste?</option>
          <option value="resolviendo la objeción: ¿por qué ir a tienda local en vez de gran superficie?">¿Tienda vs gran superficie?</option>
          <option value="resolviendo la objeción: ¿cómo puedo financiarlo sin intereses?">¿Cómo puedo financiarlo?</option>
          <option value="resolviendo la objeción: ¿es seguro contratar instaladores informales?">¿Instaladores informales?</option>
        </select>
      </div>

      <div class="filter-group" id="incluirGroup">
        <label for="incluir">Incluir en el guion</label>
        <select id="incluir">
          <option value="">Estándar</option>
          <option value="menciona que tienen financiación a 12 y 24 meses sin intereses">Financiación sin intereses</option>
          <option value="menciona la garantía completa del trabajo instalado">Garantía completa</option>
          <option value="menciona sus tiendas físicas en Zaragoza donde ver los productos en exposición">Tiendas físicas de Zaragoza</option>
          <option value="menciona la solución llave en mano: un solo interlocutor para todo">Solución llave en mano</option>
        </select>
      </div>
    </div>

    <div class="filter-group filter-group--wide">
      <label for="temaCustom">Matiz o tema personalizado (opcional)</label>
      <input type="text" id="temaCustom" placeholder='Se combina con la Temática elegida arriba, p. ej. "septiembre" + Sin IVA. Si dejas la Temática en blanco, se usa solo este texto.'>
    </div>

    <!-- Ideas rápidas -->
    <div class="quick-ideas">
      <div class="quick-ideas-label">Ideas rápidas</div>
      <div class="quick-buttons">
        <button class="quick-btn" data-idea="baño sin obra: transformación de viejo a espectacular en solo 2 días">🚿 Baño sin obra</button>
        <button class="quick-btn" data-idea="tarima vs vinilo: ¿cuál es mejor opción para tu casa?">🪵 Tarima vs vinilo</button>
        <button class="quick-btn" data-idea="3 errores graves que comete la gente al reformar su casa">⚠️ 3 errores reforma</button>
        <button class="quick-btn" data-idea="transforma tu salón con palillería decorativa sin obra">🎨 Palillería decorativa</button>
        <button class="quick-btn" data-idea="por qué cambiar las ventanas puede ahorrarte 400€ al año en calefacción">🪟 Ahorra con ventanas</button>
        <button class="quick-btn" data-idea="reforma completa del recibidor en un fin de semana">🚪 Recibidor en finde</button>
        <button class="quick-btn" data-idea="revestimiento de paredes de baño sin picar el azulejo viejo">🧱 Azulejo baño sin obra</button>
        <button class="quick-btn" data-idea="revestimiento de paredes de cocina sin obra ni escombros">🍳 Revestir cocina sin obra</button>
        <button class="quick-btn" data-idea="renueva el color de tu hogar con pintura de interiores profesional">🖌️ Pinta tu casa</button>
        <button class="quick-btn" data-idea="promoción especial: reforma tu hogar sin pagar IVA por tiempo limitado">💸 Reforma Sin IVA</button>
        <button class="quick-btn" data-idea="ofertas de Black Friday en reformas del hogar: suelos, baños, puertas y ventanas">🛍️ Black Friday reformas</button>
      </div>
    </div>

    <button class="generate-btn" id="generateBtn">
      <span id="generateBtnIcon">✨</span>
      <span id="generateBtnLabel">Generar 3 guiones</span>
    </button>
  </div>

  <!-- Loading -->
  <div class="loading" id="loading">
    <div class="dots">
      <div class="dot"></div>
      <div class="dot"></div>
      <div class="dot"></div>
    </div>
    <p id="loadingText">Generando 3 guiones personalizados…</p>
  </div>

  <!-- Error -->
  <div class="error-box" id="errorBox"></div>

  <!-- Resultados: Reels -->
  <h2 class="results-heading" id="reelResultsHeading">🎬 Reels generados</h2>
  <div class="results-actions" id="resultsActions">
    <button class="btn-secondary" id="regenerateBtn">✨ Generar 3 más</button>
    <button class="btn-word" id="wordBtn">📄 Descargar Word</button>
    <button class="btn-clear" id="clearBtn">🗑 Limpiar todo</button>
  </div>
  <div id="resultsContainer"></div>

  <!-- Resultados: Cuñas de radio -->
  <h2 class="results-heading" id="radioResultsHeading">🎙️ Cuñas de radio generadas</h2>
  <div class="results-actions" id="resultsActionsRadio">
    <button class="btn-secondary" id="regenerateRadioBtn">🎙️ Generar 3 cuñas más</button>
    <button class="btn-word" id="wordRadioBtn">📄 Descargar Word</button>
    <button class="btn-clear" id="clearRadioBtn">🗑 Limpiar todo</button>
  </div>
  <div id="resultsContainerRadio"></div>

</main>

<button id="scrollTopBtn" aria-label="Subir arriba del todo" title="Subir arriba">
  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M12 19V5"></path>
    <path d="M5 12l7-7 7 7"></path>
  </svg>
</button>

<script src="app.js"></script>
</body>
</html>
